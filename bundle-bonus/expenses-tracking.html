<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Area */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 24px; color: #0f172a; }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: var(--primary); color: white; }

        /* Dashboard Overview (Big Cards) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .card-label { font-size: 13px; color: var(--secondary); text-transform: uppercase; font-weight: 600; }
        .card-value { font-size: 32px; font-weight: 700; margin: 10px 0; color: #0f172a; }
        .card-sub { font-size: 14px; color: var(--secondary); }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        /* Category Breakdown Grid */
        .section-title { font-size: 18px; margin-bottom: 15px; font-weight: 700; }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .cat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .cat-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
        .cat-stats { font-size: 13px; color: var(--secondary); display: flex; justify-content: space-between; margin-bottom: 5px;}
        
        .progress-bg { background: #f1f5f9; height: 6px; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; }

        /* Transaction Table */
        .table-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .table-header-action {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background-color: #4338ca; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 15px; font-size: 13px; color: var(--secondary); font-weight: 600; }
        td { padding: 15px; border-top: 1px solid #f1f5f9; font-size: 14px; }
        
        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 100;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box { background: white; width: 90%; max-width: 450px; padding: 25px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        
        .modal-footer { margin-top: 20px; text-align: right; }
        .btn-cancel { background: #e2e8f0; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; margin-right: 10px; cursor: pointer; }

        /* Budget Input List in Modal */
        .budget-list-item { display: flex; align-items: center; margin-bottom: 10px; }
        .budget-list-label { flex: 1; font-size: 14px; }
        .budget-list-input { width: 120px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }

    </style>
</head>
<body>

<div class="container">
    
    <div class="header-row">
        <h1>Expense Tracking</h1>
        <button class="btn-outline" onclick="openBudgetModal()">⚙️ Edit Budget</button>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-label">Total Budget</div>
            <div class="card-value" id="dashTotalBudget">$0.00</div>
            <div class="card-sub">Sum of all categories</div>
        </div>
        <div class="card">
            <div class="card-label">Total Spent</div>
            <div class="card-value text-danger" id="dashTotalSpent">$0.00</div>
            <div class="card-sub" id="dashPercent">0% Used</div>
        </div>
        <div class="card">
            <div class="card-label">Remaining</div>
            <div class="card-value text-success" id="dashRemaining">$0.00</div>
            <div class="card-sub">Safe to spend</div>
        </div>
    </div>

    <div class="section-title">Budget vs Spent per Category</div>
    <div class="category-grid" id="categoryGrid">
        </div>

    <div class="table-wrapper">
        <div class="table-header-action">
            <div style="font-weight:700; font-size:16px;">Transaction Log</div>
            <button class="btn-primary" onclick="openExpenseModal()">+ Add Transaction</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th style="text-align:right">Amount</th>
                </tr>
            </thead>
            <tbody id="transactionTable">
                </tbody>
        </table>
    </div>

</div>

<div class="modal" id="modalExpense">
    <div class="modal-box">
        <h3 style="margin-top:0">Add New Transaction</h3>
        <form id="formExpense">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="inDate" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="inDesc" class="form-input" placeholder="e.g. Supply Store" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="inCat" class="form-input"></select>
            </div>
            <div class="form-group">
                <label>Payment Type</label>
                <input type="text" id="inType" class="form-input" placeholder="e.g. Credit Card">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" step="0.01" id="inAmount" class="form-input" placeholder="0.00" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal('modalExpense')">Cancel</button>
                <button type="submit" class="btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="modal" id="modalBudget">
    <div class="modal-box">
        <h3 style="margin-top:0">Set Category Budgets</h3>
        <p style="font-size:13px; color:#64748b; margin-bottom:20px;">Adjust the budget limit for each category below.</p>
        <form id="formBudget">
            <div id="budgetInputsContainer">
                </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal('modalBudget')">Cancel</button>
                <button type="submit" class="btn-primary">Update Budget</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- DATA STATE ---
    
    // Default budgets from your image
    let categories = {
        "Category 1": 18750,
        "Category 2": 13125,
        "Category 3": 2500,
        "Category 4": 2500,
        "Category 5": 2500,
        "Category 6": 2500,
        "Other": 500
    };

    // Default transactions from your image
    let transactions = [
        { date: '2019-01-01', cat: 'Category 3', desc: 'XYZ Supply Store', type: 'CrCard', amt: 2344.00 },
        { date: '2019-01-10', cat: 'Category 2', desc: 'ABC Services, Inc.', type: 'Online', amt: 155.00 },
        { date: '2019-01-10', cat: 'Category 4', desc: 'ABC Services, Inc.', type: 'Online', amt: 5.00 },
        { date: '2019-01-01', cat: 'Other', desc: 'Misc Item', type: 'Cash', amt: 87.23 }
    ];

    // --- RENDER FUNCTIONS ---

    const formatMoney = (num) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);

    function render() {
        // 1. Calculate Totals Per Category
        let catSpent = {};
        let totalBudget = 0;
        let totalSpent = 0;

        // Initialize spent map
        for(let c in categories) {
            catSpent[c] = 0;
            totalBudget += categories[c];
        }

        // Sum transactions
        transactions.forEach(t => {
            if(catSpent[t.cat] !== undefined) {
                catSpent[t.cat] += t.amt;
            }
            totalSpent += t.amt;
        });

        // 2. Update Main Dashboard
        document.getElementById('dashTotalBudget').innerText = formatMoney(totalBudget);
        document.getElementById('dashTotalSpent').innerText = formatMoney(totalSpent);
        document.getElementById('dashRemaining').innerText = formatMoney(totalBudget - totalSpent);
        
        let percent = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;
        document.getElementById('dashPercent').innerText = percent.toFixed(1) + "% Used";

        // 3. Render Category Cards
        const grid = document.getElementById('categoryGrid');
        grid.innerHTML = '';

        for (let [name, budget] of Object.entries(categories)) {
            const spent = catSpent[name] || 0;
            const remaining = budget - spent;
            const p = budget > 0 ? (spent / budget) * 100 : 0;
            const barColor = p > 100 ? '#ef4444' : (p > 80 ? '#f59e0b' : '#4f46e5');

            grid.innerHTML += `
                <div class="cat-card">
                    <div class="cat-header">
                        <span>${name}</span>
                        <span>${formatMoney(budget)}</span>
                    </div>
                    <div class="cat-stats">
                        <span>Spent: ${formatMoney(spent)}</span>
                        <span style="color:${remaining < 0 ? 'red' : 'green'}">${formatMoney(remaining)} left</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width:${Math.min(p, 100)}%; background:${barColor}"></div>
                    </div>
                </div>
            `;
        }

        // 4. Render Table
        const tbody = document.getElementById('transactionTable');
        tbody.innerHTML = '';
        // Sort newest first
        const sortedTrans = [...transactions].sort((a,b) => new Date(b.date) - new Date(a.date));
        
        sortedTrans.forEach(t => {
            tbody.innerHTML += `
                <tr>
                    <td>${t.date}</td>
                    <td><span style="background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:600;">${t.cat}</span></td>
                    <td>${t.desc}</td>
                    <td>${t.type}</td>
                    <td style="text-align:right; font-family:monospace; font-weight:600;">${formatMoney(t.amt)}</td>
                </tr>
            `;
        });
    }

    // --- MODAL HANDLING ---

    // Open Add Expense
    function openExpenseModal() {
        const sel = document.getElementById('inCat');
        sel.innerHTML = '';
        for(let c in categories) {
            let opt = document.createElement('option');
            opt.value = c;
            opt.innerText = c;
            sel.appendChild(opt);
        }
        document.getElementById('modalExpense').classList.add('active');
    }

    // Open Edit Budget
    function openBudgetModal() {
        const container = document.getElementById('budgetInputsContainer');
        container.innerHTML = '';
        for(let [name, budget] of Object.entries(categories)) {
            container.innerHTML += `
                <div class="budget-list-item">
                    <label class="budget-list-label">${name}</label>
                    <input type="number" name="${name}" value="${budget}" class="budget-list-input" step="100">
                </div>
            `;
        }
        document.getElementById('modalBudget').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    // --- FORM SUBMISSIONS ---

    // Save Expense
    document.getElementById('formExpense').addEventListener('submit', (e) => {
        e.preventDefault();
        const newTx = {
            date: document.getElementById('inDate').value,
            desc: document.getElementById('inDesc').value,
            cat: document.getElementById('inCat').value,
            type: document.getElementById('inType').value,
            amt: parseFloat(document.getElementById('inAmount').value)
        };
        transactions.push(newTx);
        render();
        closeModal('modalExpense');
        e.target.reset();
    });

    // Save Budget
    document.getElementById('formBudget').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputs = document.querySelectorAll('.budget-list-input');
        inputs.forEach(input => {
            const catName = input.name;
            const val = parseFloat(input.value);
            if(categories[catName] !== undefined) {
                categories[catName] = val;
            }
        });
        render(); // Re-calc everything
        closeModal('modalBudget');
    });

    // Init
    render();

    // Close on outside click
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.classList.remove('active');
        }
    }

</script>

</body>
</html>
